services:
  # 核心账本数据库
  db:
    image: postgres:15
    container_name: banking-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=banking_db
    ports:
      # 仅本机可见（避免整个局域网能连到数据库）
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - backend

  # 高并发锁与缓存
  cache:
    image: redis:7-alpine
    container_name: banking-cache
    # 必须带密码：无密码 Redis 在德国金融场景属于红线
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - backend

  app:
    build: .
    container_name: banking-app
    volumes:
      - .:/app
      - banking-logs:/var/log/banking
    env_file:
      - .env
    environment:
      - BANKING_SNOWFLAKE_WORKER_ID=1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=cache
      # Redisson 走完整 URL（带密码）；Spring Data Redis 用 SPRING_DATA_REDIS_PASSWORD
      - REDIS_URL=redis://:${REDIS_PASSWORD}@cache:6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_SERVICE_NAME=banking
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      - db
      - cache
      - kafka
      - zipkin
      - otel-collector
      - elasticsearch
    ports:
      - "8080:8080"
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Kafka 优化
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: banking-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
      # 增加堆内存
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - backend

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: banking-zipkin
    environment:
      # 内存存储必须设上限。Zipkin 默认 MEM_MAX_SPANS=500000，且默认堆很小，
      # 长时间运行会被 span 吃满 —— 实测容器曾以
      # "Terminating due to java.lang.OutOfMemoryError: Java heap space" 退出，
      # 之后 otel-collector 一直报 "Exporting failed. Dropping data."（链路数据全丢）。
      - STORAGE_TYPE=mem
      - MEM_MAX_SPANS=50000
      - JAVA_OPTS=-Xms64m -Xmx512m
    ports:
      - "127.0.0.1:9411:9411"
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: banking-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - zipkin
    networks:
      - backend

  # 消费积压（consumer lag）只能用 broker 侧数据算，应用侧拿不到：
  # Kafka 客户端指标要经 JMX/KafkaClientMetrics 才能进 Micrometer，实测在本项目里
  # 即使显式 setMicrometerEnabled(true) 也不会出现 kafka_consumer_* 系列。
  # 所以用社区标准的 kafka-exporter 从 broker 读 group offset，
  # 产出 kafka_consumergroup_lag —— Grafana 的积压面板用的就是它。
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: banking-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:9308:9308"
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.9
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - banking-logs:/var/log/banking:ro
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 64M
    networks:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
    ports:
      - "127.0.0.1:9200:9200"
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 512M
    networks:
      - backend

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/banking-alerts.yml:/etc/prometheus/banking-alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    # --web.enable-lifecycle 打开 POST /-/reload，
    # 改完告警规则不用重启容器（否则会丢掉当前告警的 firing 状态）：
    #   curl -X POST http://localhost:9090/-/reload
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 口令改为从 .env 读，不再硬编码 admin/admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # 装 ClickHouse 数据源插件：这样业务分析就能做成看板，而不是每次手写 SQL。
      # 插件在容器启动时从 grafana.com 下载（需要外网），缓存在容器内。
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      # 供 ClickHouse 数据源供给文件读取（grafana/provisioning/datasources/banking-clickhouse.yml）
      - CLICKHOUSE_PASSWORD=${SPRING_CLICKHOUSE_PASSWORD:-secret}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - backend

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: banking-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      - CLICKHOUSE_DB=banking_analytics
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=secret
    volumes:
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          # ⚠️ 不能低于 2G（2026-09-14 实测修正）。
          #
          # ClickHouse 会把 max_server_memory_usage 自动设为容器上限的 90%，
          # 并据此预先放大各项缓存（mark cache / uncompressed cache / query cache）。
          # 之前设 1G 时：上限 921MB，而它自我膨胀后的基线 RSS 就达到 890MB ——
          # 只剩 ~30MB 给真实查询，连 `SELECT ... FROM system.settings` 都会报
          # Code: 241 MEMORY_LIMIT_EXCEEDED，表现为「审计数据突然写不进去了」。
          # 表里只有 186 行数据，与此无关，纯粹是上限设置过紧。
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - backend

  # ── 告警通知链（2026-09-14 新增）────────────────────────────────────
  #
  #   Prometheus（判定）──► Alertmanager（分组/抑制/路由）──► Mailpit（收件箱）
  #
  # Mailpit 是一个「假的 SMTP 服务器 + 网页收件箱」：不需要任何账号密码，
  # 告警邮件会直接出现在 http://localhost:8025。
  # 换生产环境时只需改 alertmanager.yml 里的 smtp_smarthost / smtp_auth_*，
  # 下游的 route 与 inhibit_rules 完全不用动 —— 这就是用 Mailpit 做演示的价值。
  alertmanager:
    image: prom/alertmanager:latest
    container_name: banking-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: banking-mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP（Alertmanager 往这里发）
      - "127.0.0.1:8025:8025"   # 网页收件箱（人看这里）
    environment:
      - MP_MAX_MESSAGES=200
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - backend

  # ── 手机推送转发器（2026-09-14 新增）──────────────────────────────
  #
  #   Alertmanager（webhook 原始 JSON）──► 本服务（翻译成人话）──► ntfy.sh ──► 手机 App
  #
  # 为什么需要它：Alertmanager 的 webhook 推的是固定结构 JSON，ntfy 期望的是
  # {topic,title,message,priority,tags}，两者字段不搭。直接对接手机上会显示一坨 JSON。
  # 本服务只做翻译，不做判断；推送失败也返回 200，避免 Alertmanager 无限重试。
  #
  # topic 名从 .env 读（.env 已 gitignore）—— topic 名本身就是「密码」，
  # 知道它的人就能订阅到你的告警。
  alert-relay:
    build: ./alertrelay
    container_name: banking-alert-relay
    environment:
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
    ports:
      - "127.0.0.1:8088:8080"   # 仅用于本地调试：curl localhost:8088/health
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres-data:
  banking-logs:
    driver: local