spring:
  application:
    name: banking

  # Flyway 迁移配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # DataSource 配置
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/banking_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000

  # JPA/Hibernate 配置
  jpa:
    hibernate:
      ddl-auto: validate # Flyway 管理表结构，JPA 只做验证
      open-in-view: false # 建议关闭，以避免生产环境中的性能问题和长事务
    show-sql: true # 在控制台打印 SQL (调试用)
    #properties:
      #hibernate:
        #format_sql: true # 格式化 SQL (使 show-sql 更易读)
    database-platform: org.hibernate.dialect.PostgreSQLDialect # 指定 PostgreSQL 方言

  # Redis 配置
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cache}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: true # 启用 Redis repositories (如果你需要)

  # Kafka 配置
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  clickhouse:
    jdbc-url: ${SPRING_CLICKHOUSE_URL:jdbc:clickhouse://clickhouse:8123/banking_analytics}
    username: ${SPRING_CLICKHOUSE_USERNAME:admin}
    password: ${SPRING_CLICKHOUSE_PASSWORD:secret}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver


# 启用 Actuator 和 Prometheus 指标收集
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Redisson 配置
redisson:
  cluster:
    node:
      urls: ${REDIS_URL:redis://cache:6379}

# 日志配置 (使用 Logstash Encoder)
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT 配置
app:
  #jwtSecret: <至少 256 位的强密钥>  # ❌ 不要用默认值！
  jwtSecret: ${APP_JWT_SECRET:}
  jwtExpirationMs: 3600000 # 1 小时（单位：毫秒）调整过期时间
  # 建议增加：RefreshToken 过期时间
  jwtRefreshExpirationMs: 86400000 # 24 小时

