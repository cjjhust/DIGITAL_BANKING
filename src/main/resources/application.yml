spring:
  application:
    name: banking

  # Flyway 迁移配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # DataSource 配置 (针对 PostgreSQL，这是您实际想要的)
  datasource:
    url: jdbc:postgresql://banking-db:5432/banking_db # **!!! 替换为你的 PostgreSQL 容器地址 !!!**
    username: admin # **!!! 替换为你的 PostgreSQL 用户名 !!!**
    password: secret # **!!! 替换为你的 PostgreSQL 密码 !!!**
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000

  # JPA/Hibernate 配置
  jpa:
    hibernate:
      ddl-auto: validate # Flyway 管理表结构，JPA 只做验证
      open-in-view: false # 建议关闭，以避免生产环境中的性能问题和长事务
    show-sql: true # 在控制台打印 SQL (调试用)
    #properties:
      #hibernate:
        #format_sql: true # 格式化 SQL (使 show-sql 更易读)
    database-platform: org.hibernate.dialect.PostgreSQLDialect # 指定 PostgreSQL 方言

  # Redis 配置
  data:
    redis:
      host: cache # **!!! 替换为你的 Redis 容器服务名或 IP !!!**
      port: 6379
      repositories:
        enabled: true # 启用 Redis repositories (如果你需要)

  # Kafka 配置
  kafka:
    bootstrap-servers: kafka:9092 # 使用 Kafka 容器服务名
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # 在 application.yml 中添加 ClickHouse 配置
  clickhouse:
    url: jdbc:clickhouse://banking-clickhouse:8123/banking_analytics
    username: admin
    password: secret
    driver-class-name: ru.yandex.clickhouse.ClickHouseDriver


# 启用 Actuator 和 Prometheus 指标收集
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Redisson 配置 (如果你在使用)
redisson:
  cluster:
    node:
      urls: redis://banking-cache:6379

# 日志配置 (使用 Logstash Encoder)
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT 配置
app:
  #jwtSecret: <至少 256 位的强密钥>  # ❌ 不要用默认值！
  jwtSecret: ${APP_JWT_SECRET:}
  jwtExpirationMs: 3600000 # 1 小时（单位：毫秒）调整过期时间
  # 建议增加：RefreshToken 过期时间
  jwtRefreshExpirationMs: 86400000 # 24 小时

