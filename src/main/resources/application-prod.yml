spring:
  application:
    name: banking
  datasource:
    url: jdbc:postgresql://db:5432/banking_db
    username: admin
    password: secret
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: kafka:9092
  redis:
    host: cache
    port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

# 生产环境不放行 Swagger / OpenAPI，接口结构不对公网暴露
app:
  security:
    expose-api-docs: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: banking
