<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Digital Bank — CJJHUST</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500&display=swap');
    :root { --gold: #c5a059; --ink: #0b0f14; --glass: rgba(255,255,255,0.06); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: radial-gradient(1200px 800px at 10% -10%, #1a2332 0%, #0b0f14 60%, #05080f 100%); color: #e8e6e3; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .hero { position: relative; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .hero::before { content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.04"/></svg>'); pointer-events: none; }
    h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 8vw, 7rem); letter-spacing: -0.04em; line-height: 0.9; background: linear-gradient(135deg, #fff 40%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-fill-color: transparent; }
    .subtitle { margin-top: 1.5rem; font-size: 1.1rem; color: rgba(255,255,255,0.55); max-width: 520px; line-height: 1.6; }
    .badge { margin-top: 3rem; display: inline-flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1.2rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; background: var(--glass); backdrop-filter: blur(12px); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .copyright { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: rgba(255,255,255,0.25); letter-spacing: 0.1em; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; mask-image: radial-gradient(circle at center, black 30%, transparent 70%); -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 70%); }
  </style>
</head>
<body>
  <div class="grid"></div>
  <main class="hero">
    <h1>Visual Digital Bank</h1>
    <p class="subtitle">Distributed banking architecture with Outbox consistency, Kafka async processing, and full observability. Built for production-grade reliability.</p>
    <div class="badge">Live System — CJJHUST</div>
  </main>
  <footer class="copyright">© CJJHUST — Visual Digital Bank. All rights reserved.</footer>
</body>
</html>
