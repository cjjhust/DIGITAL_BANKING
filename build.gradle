plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jinjing'
version = '0.0.1-SNAPSHOT'

def lombokVersion = '1.18.36'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.redisson.org/release' } // Redisson 官方仓库，可能包含最新版本
}

dependencies {

    // ClickHouse 官方 JDBC 驱动 (建议使用 all 版本以包含所有必要的依赖，如 http 客户端)
    implementation 'com.clickhouse:clickhouse-jdbc:0.6.3:all'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

	// 分布式链路追踪核心依赖 - 确保版本一致性
	implementation platform('io.micrometer:micrometer-tracing-bom:1.5.2')
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
	implementation 'org.springframework.kafka:spring-kafka'
	// 增加 JSON 格式日志支持
	implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

	implementation 'org.redisson:redisson-spring-boot-starter:4.1.0'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus' // 将指标格式化为 Prometheus 识别的格式

	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation 'org.springframework.boot:spring-boot-starter-security'
	// Spring Boot 4 把 Flyway 自动配置拆到了独立模块（spring-boot-flyway）。
	// 只声明 flyway-core 不会触发自动配置：spring.flyway.* 会被静默忽略，迁移根本不执行。
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	
	// JWT 处理库 (用于生成、验证 Token)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// springdoc 2.x 依赖 Spring Framework 6 的 API（ControllerAdviceBean(Object)），
	// 在 Spring Boot 4 / Framework 7 下访问 /v3/api-docs 会抛 NoSuchMethodError；3.x 才是对应版本。
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
}

tasks.named('test') {
	useJUnitPlatform()
}
