global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: banking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
    relabel_configs:
      - replacement: production
        target_label: env
