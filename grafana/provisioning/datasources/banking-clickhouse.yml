apiVersion: 1
datasources:
  # ClickHouse 作为业务分析数据源接入 Grafana：
  # 这样「今天多少笔 / 多少钱 / 谁最活跃 / 金额结构」就是固定看板，不用每次手写 SQL。
  - name: ClickHouse
    uid: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      secure: false
      username: admin
      defaultDatabase: banking_analytics
    secureJsonData:
      # 口令从环境变量注入（见 docker-compose.yml 的 grafana 服务），不硬编码在仓库里
      password: $CLICKHOUSE_PASSWORD
